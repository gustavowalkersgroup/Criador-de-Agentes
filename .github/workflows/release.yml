name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a criar a partir da main (ex.: v1.11.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar um zip por skill
        run: bash scripts/build_dist.sh

      - name: Definir tag
        run: echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Montar notas a partir do CHANGELOG
        run: |
          tag="${TAG}"
          prev=$(git tag --sort=-v:refname | grep -v "^${tag}$" | head -1)
          awk -v cur="${tag#v}" -v prev="${prev#v}" '
            index($0, "## [" cur "]") == 1 { on = 1 }
            prev != "" && index($0, "## [" prev "]") == 1 { on = 0 }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${tag}" > notes.md

      - name: Publicar release com os zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" dist/*.zip \
            --title "${TAG}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}"
